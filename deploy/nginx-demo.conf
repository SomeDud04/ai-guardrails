# Optional unencrypted demo ingress for compose.demo.yaml.
#
# This is a transparent reverse proxy only.  It forwards the complete request
# URI and query string, and the Authorization header, to the gateway.  It does
# not serve static files, add authentication, rewrite paths, add CORS headers,
# terminate TLS or cache responses.
#
# The root filesystem is read-only in Compose, so every writable path lives on
# the small /tmp tmpfs.  The master process runs as UID/GID 101:101; there is no
# `user` directive because the process is already unprivileged.

pid /tmp/nginx.pid;

# Critical errors only go to stderr.  Access logging is disabled, so request
# URIs, headers (including Authorization) and bodies are not routinely logged.
error_log /dev/stderr crit;

worker_processes 1;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    # Match the gateway's default request-body limit (64 KiB).  The application
    # returns 413 for bodies above its own configured limit.  If the operator
    # raises the application limit, raise this value too and review buffering.
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 90s;

    # All writable paths stay on the tmpfs mounted by compose.demo.yaml.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's embedded DNS.  The short TTL plus variable-based proxy_pass makes
    # nginx re-resolve `gateway` at request time, so a rebuilt gateway container
    # with a new address does not leave a stale upstream IP cached.  Lookup and
    # connect waits are finite.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # Forward the client's bearer credential unchanged.  Other request headers
    # are passed through by default.  Do not add logging for either.
    #
    # `$http_host` is the client's Host header verbatim, including any explicit
    # port (for example VM_LAN_IP:8080).  `$host` would drop the port, so use
    # `$http_host` to keep absolute URLs and origin checks intact.  No
    # client-supplied forwarding headers (X-Forwarded-For, Forwarded) are
    # trusted or generated here, and no CORS headers are added.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_body on;
    proxy_pass_request_headers on;
    proxy_request_buffering on;

    # Pass upstream responses and their headers (including CSP, nosniff and
    # frame headers) straight through.  No caching, no error interception and
    # no automatic retry: a retried POST could duplicate a chat/audit action.
    proxy_buffering on;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_next_upstream off;

    # The application's default chat deadline is 60 s.  These waits are finite
    # and longer than that default.  If an operator configures a longer chat
    # deadline, both response-side timeouts must be increased accordingly.
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    server {
        listen 8080;
        server_name _;

        # A variable-based proxy_pass without a URI component forwards the
        # original path and query string unchanged.  /health/live is the
        # gateway's liveness endpoint; it is not a guard-activation or
        # readiness claim and this ingress does not expose /health/ready to
        # callers differently from the gateway itself.
        location / {
            set $gateway_upstream gateway;
            proxy_pass http://$gateway_upstream:8000;
        }
    }
}
