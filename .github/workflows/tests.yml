name: tests

# Runs the whole automated suite on every push and pull request, on a clean
# machine, so a result does not depend on any one laptop. No secrets, models or
# network services are used: the guards and the model are test doubles.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install ".[test]" "openpyxl==3.1.5"
      - name: Run the suite
        run: python -m unittest discover -s tests
