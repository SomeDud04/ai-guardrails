# Optional LOCAL guard overlay for compose.yaml (Qwen3Guard-Gen, in-process).
#
# This file is inert configuration scaffolding, not runtime proof.  It selects
# the opt-in ``guards`` Dockerfile target, sets guarded mode explicitly, selects
# ``NASI_LEMAK_GUARD_BACKEND=qwen3guard-local``, and mounts one operator-approved
# policy file and the local Qwen3Guard-Gen directory read-only.  No model ID is
# invented, no model or license is supplied, and no image is built, started or
# benchmarked by this file.
#
# Always apply it ON TOP of the default stack (never alone):
#
#   docker compose \
#     --env-file .secrets/compose.env \
#     --env-file .secrets/compose.pilot.env \
#     -f compose.yaml -f compose.pilot.yaml config
#
# See docs/compose.pilot.env.example.
#
# Bind mounts use the long syntax with ``create_host_path: false``: a missing
# host policy/model path aborts the start instead of silently creating an empty
# directory that would look configured but fail later.  All host paths are
# mandatory ``:?`` interpolation values; nothing is defaulted.  The Qwen
# container directory is also a mandatory ``:?`` value, and the same expression
# is used for the environment variable and the bind target so they cannot drift.
#
# The gateway keeps the base file's non-root UID/GID 10001, read-only root
# filesystem, dropped capabilities, no-new-privileges, localhost-only published
# port and private database network.  Local Compose file secrets are host files
# and must be readable by UID 10001; this file does not claim that Compose
# uid/gid/mode remapping works for them.  No model is downloaded at build or
# start: the model bundles must already be complete on the host.  (The guard
# Python packages are installed during the image build only.)

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      # Guard-enabled image.  The default Dockerfile stage remains ``server``.
      target: guards
    image: nasi-lemak-gateway:0.1.0-pilot
    environment:
      # Explicit guarded mode.  The test acknowledgement must stay false: this
      # is not test mode and there is no unguarded fallback.
      - NASI_LEMAK_MODE=guarded
      - NASI_LEMAK_ALLOW_UNGUARDED_TEST=false
      # The local Qwen3Guard-Gen transport, selected explicitly.  The backend
      # name is never inferred from a directory or URL.
      - NASI_LEMAK_GUARD_BACKEND=qwen3guard-local
      # Container paths must match the read-only bind targets below.
      - NASI_LEMAK_POLICY_FILE=/run/pilot/policy/policy.yaml
      # Required Qwen model directory.  The value is a mandatory ``:?``
      # interpolation and the same expression is the bind target below, so the
      # runtime variable and the mount cannot disagree.  A missing value aborts
      # Compose instead of starting a backend without a model.
      - NASI_LEMAK_QWEN3GUARD_MODEL_DIR=${PILOT_QWEN_GUARD_MODEL_CONTAINER_DIR:?Set PILOT_QWEN_GUARD_MODEL_CONTAINER_DIR to the Qwen3Guard-Gen container directory}
      # Optional, independent validated settings.  Bare pass-through entries:
      # no default is hardcoded here, so an unset value keeps the documented
      # application default from docs/guards.md.  The threshold range, worker
      # and thread bounds (workers * threads <= cpu_count) and the long-input
      # range are all validated before any loader runs.  A bad value leaves the
      # app unready (generic 503) rather than selecting a laxer lane.
      - NASI_LEMAK_QWEN3GUARD_INPUT_THRESHOLD
      - NASI_LEMAK_QWEN3GUARD_OUTPUT_THRESHOLD
      - NASI_LEMAK_QWEN3GUARD_WORKERS
      - NASI_LEMAK_QWEN3GUARD_THREADS
      - NASI_LEMAK_QWEN3GUARD_LONG_INPUT
      # Distinct operator credentials.  The runtime writer keeps the base
      # file's existing NASI_LEMAK_AUDIT_DSN_FILE/audit_dsn secret.
      - NASI_LEMAK_OPERATOR_KEY_DIGEST_FILE=/run/secrets/operator_key_digest
      - NASI_LEMAK_OPERATOR_AUDIT_DSN_FILE=/run/secrets/operator_audit_dsn
      # Never resolve or download model weights at runtime.
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
    volumes:
      - type: bind
        source: ${PILOT_POLICY_FILE:?Set PILOT_POLICY_FILE to an approved policy-file path}
        target: /run/pilot/policy/policy.yaml
        read_only: true
        bind:
          create_host_path: false
      # Qwen mount.  Target uses the same required interpolation as the
      # environment entry above.
      - type: bind
        source: ${PILOT_QWEN_GUARD_MODEL_DIR:?Set PILOT_QWEN_GUARD_MODEL_DIR to a local Qwen3Guard-Gen directory}
        target: ${PILOT_QWEN_GUARD_MODEL_CONTAINER_DIR:?Set PILOT_QWEN_GUARD_MODEL_CONTAINER_DIR to the Qwen3Guard-Gen container directory}
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - operator_key_digest
      - operator_audit_dsn
    # Provisionally sized for CPU-only native adapters; separate from the
    # lightweight 512 MiB/1 CPU default.  These values are not benchmarked.
    mem_limit: ${GUARD_MEM_LIMIT:-8g}
    cpus: ${GUARD_CPUS:-4.0}
    pids_limit: ${GUARD_PIDS_LIMIT:-512}
    healthcheck:
      # Probes the application's real structural readiness endpoint with the
      # Python standard library and a finite request timeout.  ``/health/ready``
      # checks configuration, policy activation and audit-store readiness; it
      # is NOT classifier accuracy, native model warmup or a deployment proof.
      # A non-200 response (for example 503 pending configuration) fails the
      # probe.  The 7 s client request timeout exceeds the server's 5 s
      # readiness deadline and stays inside the 8 s healthcheck timeout, so a
      # slow but successful readiness check is not cut off by the probe while
      # every wait remains finite.  The start period allows for slow local model
      # loading.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request

          try:
              with urllib.request.urlopen(
                  "http://127.0.0.1:8000/health/ready", timeout=7
              ) as response:
                  healthy = response.status == 200
          except Exception:
              healthy = False

          raise SystemExit(0 if healthy else 1)
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10m

secrets:
  operator_key_digest:
    file: ${OPERATOR_KEY_DIGEST_FILE:?Set OPERATOR_KEY_DIGEST_FILE to an absolute secret-file path}
  operator_audit_dsn:
    file: ${OPERATOR_AUDIT_DSN_FILE:?Set OPERATOR_AUDIT_DSN_FILE to an absolute secret-file path}
