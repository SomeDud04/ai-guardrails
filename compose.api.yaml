# Optional guarded-mode overlay using the API guard backend.
#
# This overlay is inert packaging, not runtime proof.  It selects the
# lightweight ``server`` Dockerfile target (no native ML dependencies), sets
# guarded mode, selects ``NASI_LEMAK_GUARD_BACKEND=api`` explicitly, and keeps
# the test-mode acknowledgement false.  No guard model directory is mounted and
# no Prompt Guard / Llama Guard checkpoint is read locally.
#
# Always apply it ON TOP of the default stack (never alone) and never combine it
# with compose.pilot.yaml or compose.test.yaml:
#
#   docker compose \
#     --env-file .secrets/compose.env \
#     --env-file .secrets/compose.api.env \
#     -f compose.yaml -f compose.api.yaml config
#
# See docs/compose.api.env.example for the non-secret operator values and
# docs/install-ubuntu.md for the installer flow.  Bearer key files are host
# files mounted through Compose secrets; the key and DSN values are never part
# of this file or the generated env file.
#
# ``NASI_LEMAK_INPUT_GUARD_API_KEY_FILE`` and
# ``NASI_LEMAK_OUTPUT_GUARD_API_KEY_FILE`` are deliberately bare list entries.
# Compose only passes them to the container when the operator env file defines
# them, which is required for bearer auth and must be omitted for auth ``none``.
# The empty secret files used for an unused auth mode are never referenced by a
# runtime ``_API_KEY_FILE`` variable.
#
# Private CA trust is an explicit, separate read-only mount in
# compose.api-ca.yaml.  TLS verification is never disabled; the base overlay
# does not set ANY ``*_ALLOW_INSECURE_HTTP`` value.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      # Lightweight server target; no optional guard ML dependencies.
      target: server
    image: nasi-lemak-gateway:0.1.0
    environment:
      # Explicit guarded mode with the API backend.  The test acknowledgement
      # must remain false: this is not test mode.
      - NASI_LEMAK_MODE=guarded
      - NASI_LEMAK_ALLOW_UNGUARDED_TEST=false
      - NASI_LEMAK_GUARD_BACKEND=api
      - NASI_LEMAK_POLICY_FILE=/run/pilot/policy/policy.yaml
      # Distinct operator reader credentials, reusing the existing test/pilot
      # secret pattern.  The runtime writer keeps the base file's audit DSN.
      - NASI_LEMAK_OPERATOR_KEY_DIGEST_FILE=/run/secrets/operator_key_digest
      - NASI_LEMAK_OPERATOR_AUDIT_DSN_FILE=/run/secrets/operator_audit_dsn
      # Nonsecret input classifier contract settings.
      - "NASI_LEMAK_INPUT_GUARD_URL=${NASI_LEMAK_INPUT_GUARD_URL:?Set NASI_LEMAK_INPUT_GUARD_URL to the approved input guard base URL}"
      - "NASI_LEMAK_INPUT_GUARD_MODEL=${NASI_LEMAK_INPUT_GUARD_MODEL:?Set NASI_LEMAK_INPUT_GUARD_MODEL to the exact served input model}"
      - "NASI_LEMAK_INPUT_GUARD_AUTH=${NASI_LEMAK_INPUT_GUARD_AUTH:?Set NASI_LEMAK_INPUT_GUARD_AUTH to bearer or none}"
      - "NASI_LEMAK_INPUT_GUARD_THRESHOLD=${NASI_LEMAK_INPUT_GUARD_THRESHOLD:?Set NASI_LEMAK_INPUT_GUARD_THRESHOLD in [0, 1]}"
      - NASI_LEMAK_INPUT_GUARD_CONTRACT=nasi-lemak-input-classifier-v1
      # Optional hosted input/output pair.  Both are bare pass-through entries:
      # omitted (the default) keeps the custom /classify input contract plus
      # the Qwen3Guard output adapter unchanged.  Setting only one, or any
      # unknown value, leaves the app unready.  The contract above is ignored
      # only when the complete hosted pair is selected.
      - NASI_LEMAK_INPUT_GUARD_PROVIDER
      - NASI_LEMAK_OUTPUT_GUARD_PROVIDER
      # Nonsecret output classifier contract settings.
      - "NASI_LEMAK_OUTPUT_GUARD_URL=${NASI_LEMAK_OUTPUT_GUARD_URL:?Set NASI_LEMAK_OUTPUT_GUARD_URL to the approved output guard base URL}"
      - "NASI_LEMAK_OUTPUT_GUARD_MODEL=${NASI_LEMAK_OUTPUT_GUARD_MODEL:?Set NASI_LEMAK_OUTPUT_GUARD_MODEL to the exact served output model}"
      - "NASI_LEMAK_OUTPUT_GUARD_AUTH=${NASI_LEMAK_OUTPUT_GUARD_AUTH:?Set NASI_LEMAK_OUTPUT_GUARD_AUTH to bearer or none}"
      # Only defined for an endpoint using bearer auth; omitted for auth none.
      - NASI_LEMAK_INPUT_GUARD_API_KEY_FILE
      - NASI_LEMAK_OUTPUT_GUARD_API_KEY_FILE
      # Optional validated transport settings; omitted unless the operator sets
      # them, so the server keeps its documented finite defaults.
      - NASI_LEMAK_INPUT_GUARD_TIMEOUT
      - NASI_LEMAK_INPUT_GUARD_MAX_RESPONSE_BYTES
      - NASI_LEMAK_INPUT_GUARD_ALLOW_INSECURE_HTTP
      - NASI_LEMAK_OUTPUT_GUARD_TIMEOUT
      - NASI_LEMAK_OUTPUT_GUARD_MAX_RESPONSE_BYTES
      - NASI_LEMAK_OUTPUT_GUARD_ALLOW_INSECURE_HTTP
    volumes:
      - type: bind
        source: ${API_POLICY_FILE:?Set API_POLICY_FILE to an approved policy-file path}
        target: /run/pilot/policy/policy.yaml
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - operator_key_digest
      - operator_audit_dsn
      - input_guard_key
      - output_guard_key
    # Keep the base file's lightweight 512 MiB / 1 CPU profile, non-root user,
    # read-only root filesystem, dropped capabilities and loopback-only port.

secrets:
  operator_key_digest:
    file: ${OPERATOR_KEY_DIGEST_FILE:?Set OPERATOR_KEY_DIGEST_FILE to an absolute secret-file path}
  operator_audit_dsn:
    file: ${OPERATOR_AUDIT_DSN_FILE:?Set OPERATOR_AUDIT_DSN_FILE to an absolute secret-file path}
  input_guard_key:
    file: ${INPUT_GUARD_KEY_SOURCE_FILE:?Set INPUT_GUARD_KEY_SOURCE_FILE to a readable key-file path}
  output_guard_key:
    file: ${OUTPUT_GUARD_KEY_SOURCE_FILE:?Set OUTPUT_GUARD_KEY_SOURCE_FILE to a readable key-file path}
